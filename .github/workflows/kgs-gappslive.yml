name: kgs-gappslive

# REAL PLAY STORE ON OUR OWN CONTAINER PHONE.
#
# The user asked for the Play Store to be put INTO the phone we already drive,
# rather than running a second phone on a Mac. That is exactly what this does:
# a community-built redroid image that has Google Play Services and the Play
# Store baked in (MindTheGapps, arm64, Android 14 - the same Android version
# the plain image has been running), driven by the SAME proven live-control
# loop through the device layer (DEV_MODE=adb, which redroid speaks too).
#
# Why this can do what Aurora could not: eFootball's remaining ~2 GB is
# Play Asset Delivery, handed out by the Play Store itself using its own
# account and licensing. Aurora is an independent client and cannot answer
# that. A real Play Store can.
#
# What is reused unchanged: the binder/redroid boot, the cached game package
# install (pm session API), the live tap/screenshot round-trip over
# live-cmd/live-res, the burner-account secrets, artifact upload.
#
# Two hard-won fixes are baked in:
#   * the intercept CA is installed BEFORE the phone reboots, because
#     Android's system trust store is enumerated by the system server once
#     and cached; a CA dropped in later is invisible to every app until the
#     phone restarts. Aurora's traffic was rejected for exactly this reason.
#   * the redirect is a host-side DNAT on docker0 via iptables-legacy, after
#     `modprobe iptable_nat`. The phone's own netns has no nat table, and the
#     nft REDIRECT target is missing from this kernel.
#
# Drive it: write one command to live-cmd/cmd.txt. Sighn-in to Play with the
# burner account may ask for a number match -- the operator supplies it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gapps:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      PEERLINK_GMAIL: ${{ secrets.PEERLINK_GMAIL }}
      PEERLINK_GPASS: ${{ secrets.PEERLINK_GPASS }}
      # Rolling Google 2FA code. A secret, never a commit: the two codes typed
      # into live-cmd on 2026-09-30 are in that branch's PUBLIC history and
      # must never be repeated.
      PEERLINK_GCODE: ${{ secrets.PEERLINK_GCODE }}
      DEV_MODE: adb
      # REQUIRED in adb mode. dev.sh calls plain `adb shell ...` with no -s,
      # and on this runner adb reports no default device, so every tap and
      # every screenshot silently produced nothing (adb's stderr is discarded
      # by dev.sh). ANDROID_SERIAL is honoured by adb itself, so one variable
      # fixes every call in the loop.
      ANDROID_SERIAL: 127.0.0.1:5555
    steps:

      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 01 binder + redroid WITH Play Store
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1
          exec > >(tee $W/step01.log) 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y -qq kmod "linux-modules-extra-$(uname -r)" 2>&1 | tail -2
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe binder_linux || true
          lsmod | grep -i binder || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || \
            sudo mount -t binder none /dev/binderfs || true
          if ! mount | grep -qi binder; then
            echo "=== BINDER DIAGNOSTICS ==="
            uname -r
            sudo grep -i ANDROID_BINDER /boot/config-$(uname -r) 2>/dev/null
            echo "=== END DIAGNOSTICS ==="
            exit 1
          fi
          sudo mkdir -p /root/rd
          sudo docker rm -f redroid >/dev/null 2>&1 || true
          # MindTheGapps arm64 image: Play Services + Play Store included.
          IMAGE=edwardzhouquan/redroid-mindthegapps-arm64:14.0.0-arm64_only
          echo "image: $IMAGE"
          sudo docker pull "$IMAGE" 2>&1 | tail -3
          sudo docker run -d --name redroid --privileged \
            -v /root/rd:/data -p 5555:5555 -p 27042:27042 \
            "$IMAGE" \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 androidboot.use_memfd=true || \
            { echo "DOCKER RUN FAILED"; sudo docker logs redroid; exit 1; }
          # GMS initialises slowly; give it real time.
          booted=0
          for i in $(seq 1 120); do
            if [ "$(sudo docker exec redroid getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "BOOTED after $((i*5))s"; booted=1; break
            fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "=== ANDROID DID NOT BOOT ==="
            sudo docker ps -a
            sudo docker logs --tail 60 redroid 2>&1
            exit 1
          fi
          echo "=== IS THE PLAY STORE ACTUALLY IN THERE? ==="
          sudo docker exec redroid /system/bin/pm list packages 2>/dev/null \
            | grep -iE "vending|com.google.android.gms|gsf" || \
            echo "=== NO PLAY STORE - THIS IMAGE IS NOT WHAT WE NEED ==="
          sudo docker exec redroid /system/bin/pm path com.android.vending 2>&1
          # adb over TCP must be (re)established explicitly, and the boot can
          # finish before the port is actually accepting. Keep connecting
          # until it answers, so every later step has a working device.
          sudo apt-get install -y -qq adb 2>&1 | tail -2 || true
          for i in $(seq 1 30); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null \
                 | tr -d '\r' | grep -q '^1$'; then
              echo "adb answering after $((i*5))s"
              break
            fi
            sleep 5
          done
          adb -s 127.0.0.1:5555 shell getprop ro.product.model | tr -d '\r'

      - name: 04a declare touchscreen.multitouch and stage sign-in credentials
        env:
          PEERLINK_GMAIL: ${{ secrets.PEERLINK_GMAIL }}
          PEERLINK_GPASS: ${{ secrets.PEERLINK_GPASS }}
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W

          # The redroid GApps image declares only android.hardware.touchscreen and
          # ships no android.hardware.touchscreen.multitouch*.xml, even though its
          # own /vendor/etc/permissions/handheld_core_hardware.xml says one must be
          # included. eFootball declares
          #     <uses-feature android:name="android.hardware.touchscreen.multitouch"/>
          # with android:required omitted, which the Android spec defines as
          # required=true. With the feature absent, Play's device compatibility check
          # refuses the app ("isn't compatible with your device") while apps that
          # need no graphics feature (CPU-Z) install normally. This is a capability
          # declaration, not an identity change.
          adb -s 127.0.0.1:5555 shell su 0 mkdir -p /data/local/tmp/perm
          # NB: `adb push` has no -q flag; passing one fails and silently leaves
          # the file on the host, which is how the first attempt at this step
          # died. Verify the copy landed before trusting it.
          adb -s 127.0.0.1:5555 push \
            kgs-login/live/android.hardware.touchscreen.multitouch.xml \
            /data/local/tmp/perm/mt.xml
          adb -s 127.0.0.1:5555 shell wc -c /data/local/tmp/perm/mt.xml
          adb -s 127.0.0.1:5555 shell su 0 cp /data/local/tmp/perm/mt.xml \
            /vendor/etc/permissions/android.hardware.touchscreen.multitouch.xml
          adb -s 127.0.0.1:5555 shell su 0 cp /data/local/tmp/perm/mt.xml \
            /system/etc/permissions/android.hardware.touchscreen.multitouch.xml
          echo "--- restarting the phone so PermissionManager re-reads ---"
          sudo docker restart redroid
          sleep 35
          adb connect 127.0.0.1:5555 2>&1 | tail -1
          for i in $(seq 1 40); do
            [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
              && { echo "phone back after $((i*5))s"; break; }
            sleep 5
          done
          echo "--- touchscreen features the phone now advertises ---"
          adb -s 127.0.0.1:5555 shell pm list features 2>/dev/null | grep -i touchscreen
          adb -s 127.0.0.1:5555 shell pm list features 2>/dev/null \
            | grep -q touchscreen.multitouch \
            && echo "MULTITOUCH DECLARED" \
            || { echo "=== MULTITOUCH STILL MISSING ==="; exit 1; }

          # Sign-in credentials arrive as Actions secrets and are written to a
          # root-only file on the runner. The live command channel is a file in a
          # PUBLIC git branch, so a password must never be typed into cmd.txt --
          # that is how the burner password leaked into history before. Commands
          # read this file instead: PW=$(cat $W/creds/GPASS)
          mkdir -p $W/creds
          printf '%s' "$PEERLINK_GMAIL" > $W/creds/GMAIL
          printf '%s' "$PEERLINK_GPASS" > $W/creds/GPASS
          chmod 600 $W/creds/GMAIL $W/creds/GPASS
          echo "creds staged: $(wc -c < $W/creds/GMAIL) byte email, $(wc -c < $W/creds/GPASS) byte password"

      # kgs-capture.yml has frida but no game (no Play, so nothing to run).
      # This workflow has the game but no frida. The game only reaches its login
      # AFTER Play has delivered the asset packs, and the plaintext request bytes
      # only exist inside libUE4.so's own send path -- so both halves have to be in
      # the SAME container. That is the whole reason this step exists.

      # Play Asset Delivery only serves asset packs to an app PLAY ITSELF
      # installed. The old step 04 sideloaded the XAPK with `pm install-create`,
      # which installs the binary and nothing else -- the game then boots and
      # reports "Download Failed 0%". The run that actually delivered 1.97 GB
      # on 2026-09-30 began by UNINSTALLING the sideloaded copy (live-cmd commit
      # UI, 23:42) and installing from the Play page (UJ, 23:43). That sequence
      # existed only in the git history of the live command branch, which is why
      # it had to be rediscovered from scratch on 2026-10-01.
      #
      # Interception must also be OFF here. Play rejects the proxy's
      # certificate and the only symptom is a bare "Download Failed 0%" with no
      # hint that the recorder is the cause; measured 06:01 today as "Client TLS
      # handshake failed ... play.googleapis.com". The recorder is armed in 04c.
      - name: 04b install the game FROM Play, then wait for the asset packs
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1

          HOSTGW=$(ip -4 addr show docker0 2>/dev/null \
                   | grep -oE "inet [0-9.]+" | head -1 | cut -d" " -f2)
          while sudo iptables-legacy -t nat -D PREROUTING -i docker0 -p tcp \
                --dport 443 -j DNAT --to-destination "$HOSTGW:8080" 2>/dev/null; do
            echo "removed a stale DNAT rule"
          done
          echo "dnat rules left (must be 0): $(sudo iptables-legacy -t nat -L PREROUTING -n | grep -c DNAT)"

          if adb -s 127.0.0.1:5555 shell pm list packages 2>/dev/null | grep -qi konami; then
            echo "uninstalling the sideloaded copy -- Play will not serve it"
            adb -s 127.0.0.1:5555 shell pm uninstall jp.konami.pesam
          fi

          bash kgs-login/live/play_install.sh 127.0.0.1:5555
          echo "play_install rc=$? (2 = stopped for a human 2FA code)"

          # Deliberately does not fail the job. If the install did not happen,
          # the live loop still runs and it is the only channel that can be
          # driven by hand; killing the run here would throw that away.
          adb -s 127.0.0.1:5555 shell pm path jp.konami.pesam 2>/dev/null \
            || echo "=== GAME NOT INSTALLED - the live loop has to fix this ==="
          exit 0

      # Armed AFTER the download on purpose: interception and the asset packs
      # cannot coexist in time, because Play will not download through a proxy
      # it does not trust. The hook in 04d needs none of this -- it forces the
      # game's own plaintext path -- so this step is for the gate channel only,
      # and is not allowed to take the run down with it.
      #
      # The Conscrypt bind-mount below is the fix for "the CA is installed by
      # hash, every app still refuses the proxy's certificate". On Android 14
      # apps read the trust store from the Conscrypt APEX, which carries its own
      # 134-cert copy of the store; ours was in /system but absent from the
      # apex. Found and fixed by hand at 00:15-00:16 on 2026-10-01 and never
      # written into a workflow, so every run since had a CA nothing read.
      - name: 04c arm the recorder (CA + Conscrypt apex, proxy, tcpdump)
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1

          bash kgs-login/scripts/setup_ca.sh redroid "$W/ca" 2>&1 | tail -8
          HASH=$(cat "$W/ca/ca.hash" 2>/dev/null)
          echo "ca hash: ${HASH:-<none>}"

          adb -s 127.0.0.1:5555 shell su 0 mount --bind \
            /system/etc/security/cacerts /apex/com.android.conscrypt/cacerts 2>&1 | tail -2
          echo "system store certs: $(adb -s 127.0.0.1:5555 shell su 0 ls /system/etc/security/cacerts 2>/dev/null | wc -l)"
          echo "apex store certs:   $(adb -s 127.0.0.1:5555 shell su 0 ls /apex/com.android.conscrypt/cacerts 2>/dev/null | wc -l)"
          if [ -n "$HASH" ]; then
            adb -s 127.0.0.1:5555 shell su 0 ls -l \
              /apex/com.android.conscrypt/cacerts/$HASH.0 2>&1
          fi

          echo "--- restarting zygote so the trust store is re-read ---"
          sudo docker exec redroid sh -c 'setprop ctl.restart zygote' 2>/dev/null || true
          sleep 25
          for i in $(seq 1 60); do
            [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] \
              && { echo "phone back after $((i*5))s"; break; }
            sleep 5
          done
          adb connect 127.0.0.1:5555 2>&1 | tail -1

          echo "--- proxy on the host, signing with OUR ca.key ---"
          python3 -m pip install --quiet --break-system-packages mitmproxy \
            || echo "MITMPROXY INSTALL FAILED"
          mkdir -p $W/mitm
          if [ -f "$W/ca/ca.key" ]; then
            cat "$W/ca/ca.key" "$W/ca/ca.crt" > $W/mitm/mitmproxy-ca.pem
            cp -f "$W/ca/ca.crt" $W/mitm/mitmproxy-ca-cert.pem
          else
            echo "no ca.key; mitmproxy will use its own CA"
          fi
          FLOWS_LOG=$W/flows.log nohup setsid mitmdump \
            --mode transparent --listen-port 8080 \
            --set confdir=$W/mitm -s kgs-login/scripts/mitm_addon.py \
            -w $W/flows.mitm > $W/mitm.log 2>&1 < /dev/null &
          sleep 12
          grep -q ADDON-READY $W/flows.log 2>/dev/null \
            && echo "proxy up, addon loaded" \
            || { echo "=== PROXY OR ADDON DID NOT START ==="; head -30 $W/mitm.log; }

          echo "--- packet capture for the whole session ---"
          sudo docker exec redroid sh -c \
            'rm -f /data/local/tmp/game2.pcap; nohup tcpdump -i any -s 0 -w /data/local/tmp/game2.pcap tcp >/data/local/tmp/tcpdump2.out 2>&1 &'
          sleep 2
          sudo docker exec redroid sh -c 'ps -A | grep -i tcpdump' || echo "tcpdump NOT running"

          # DNAT last of all: anything that reaches Play after this point goes
          # through the proxy and will fail its certificate check.
          sudo modprobe iptable_nat || true
          HOSTGW=$(ip -4 addr show docker0 2>/dev/null \
                   | grep -oE "inet [0-9.]+" | head -1 | cut -d" " -f2)
          echo "docker0 gateway: [$HOSTGW]"
          sudo iptables-legacy -t nat -A PREROUTING -i docker0 -p tcp \
            --dport 443 -j DNAT --to-destination "$HOSTGW:8080" 2>&1
          echo "dnat rc=$?"
          sudo iptables-legacy -t nat -L PREROUTING -n | head -6
          echo "RECORDER ARMED (gRPC plaintext capture does not depend on any of this)"
          exit 0

      - name: 04d frida-server + plaintext hook (assets are on disk by now)
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1

          if ! adb -s 127.0.0.1:5555 shell pm list packages 2>/dev/null | grep -qi konami; then
            echo "=== GAME NOT INSTALLED - frida step bailing early ==="
            exit 0
          fi
          echo "game present: $(adb -s 127.0.0.1:5555 shell pm path jp.konami.pesam 2>/dev/null | tr -d '\r')"

          python3 -m pip install --quiet --break-system-packages frida-tools \
            || { echo "PIP FAILED"; pip3 install --break-system-packages frida-tools; }
          FRIDA_VER=$(python3 -c "import frida; print(frida.__version__)" 2>/dev/null)
          echo "frida client version: ${FRIDA_VER:-<none>}"
          [ -n "$FRIDA_VER" ] || { echo "=== NO FRIDA PYTHON MODULE ==="; exit 1; }

          ok=0
          url="https://github.com/frida/frida/releases/download/${FRIDA_VER}/frida-server-${FRIDA_VER}-android-arm64.xz"
          echo "trying $url"
          curl -fsSL --max-time 300 -o $W/frida-server.xz "$url" && ok=1
          if [ "$ok" != "1" ]; then
            echo "=== FRIDA SERVER DOWNLOAD FAILED ==="
            curl -sS --max-time 30 "https://api.github.com/repos/frida/frida/releases/latest" \
              | grep -o '"name": *"frida-server-[^"]*android-arm64[^"]*"' || true
            exit 1
          fi
          xz -d -f $W/frida-server.xz || { echo "=== XZ FAILED ==="; exit 1; }
          ls -la $W/frida-server

          sudo docker cp $W/frida-server redroid:/data/local/tmp/frida-server || exit 1
          sudo docker exec redroid chmod 755 /data/local/tmp/frida-server
          sudo docker exec redroid mkdir -p /data/local/tmp/kgs
          # keep stderr: Android 14 is SELinux enforcing and exec from
          # /data/local/tmp is a common failure mode. `docker exec -d` discards
          # that output, which is why this step previously died with an empty log.
          sudo docker exec -d redroid sh -c \
            '/data/local/tmp/frida-server > /data/local/tmp/frida.out 2>&1'
          sleep 8
          echo "--- frida-server output ---"
          sudo docker exec redroid sh -c 'cat /data/local/tmp/frida.out 2>&1' || true
          echo "--- process list ---"
          sudo docker exec redroid sh -c 'ps -A | grep -i frida' || echo "frida-server NOT running"
          echo "--- selinux ---"
          sudo docker exec redroid sh -c 'getenforce 2>&1' || true
          nc -zv 127.0.0.1 27042 && echo "frida-server REACHABLE" || echo "frida-server NOT reachable"
          file $W/frida-server 2>/dev/null || head -c 20 $W/frida-server | xxd | head -2

          # Attach the plaintext hook and relaunch the game. The hook forces
          # Def_Online_gRPC_insecure=1 and intercepts libc send/write, so the
          # frames land in /data/local/tmp/kgs on the device -- unencrypted,
          # written by the game's own code. This is the photocopier step: we are
          # reading the game's bytes, not synthesising them.
          adb -s 127.0.0.1:5555 shell am force-stop jp.konami.pesam 2>/dev/null
          adb -s 127.0.0.1:5555 shell rm -rf /data/local/tmp/kgs 2>/dev/null
          adb -s 127.0.0.1:5555 shell mkdir -p /data/local/tmp/kgs 2>/dev/null
          adb -s 127.0.0.1:5555 push -q kgs-login/scripts/capture_insecure.js \
            /data/local/tmp/capture_insecure.js 2>&1 | tail -2

          # 7200, not 900: the hook has to outlive this step. It is detached, so
          # it keeps running into step 05, and the live loop is what actually
          # walks the game to the login screen. A 15 minute cap killed the hook
          # while the operator was still navigating.
          nohup setsid timeout 7200 frida -H 127.0.0.1:27042 -f jp.konami.pesam \
            -l kgs-login/scripts/capture_insecure.js --runtime=v8 \
            > $W/frida-gapps.log 2>&1 < /dev/null &
          FRIDA_PID=$!
          echo "frida pid $FRIDA_PID (detached)"
          sleep 20
          echo "--- frida log ---"
          cat $W/frida-gapps.log 2>&1 | tail -25
          kill -0 $FRIDA_PID 2>/dev/null || echo "NOTE: frida client already exited; the game was still spawned by -f"

          # Watch for frames. The game's first screen is a splash/terms prompt with
          # nobody there to tap it, so nudge it the way a player would.
          for i in $(seq 1 24); do
            sleep 10
            n=$(adb -s 127.0.0.1:5555 shell 'ls /data/local/tmp/kgs 2>/dev/null | wc -l' 2>/dev/null | tr -d '\r')
            pid=$(adb -s 127.0.0.1:5555 shell pidof jp.konami.pesam 2>/dev/null | tr -d '\r')
            echo "  hook t=$((i*10))s frames=${n:-?} gamepid=${pid:-none}"
            adb -s 127.0.0.1:5555 shell input swipe 640 620 640 620 200 >/dev/null 2>&1
            adb -s 127.0.0.1:5555 shell input tap 360 400  >/dev/null 2>&1
            if [ "${n:-0}" != "0" ] && [ "${i}" -ge 8 ]; then
              echo "=== FRAMES APPEARED at t=$((i*10))s - stopping the nudge ==="
              break
            fi
          done

          echo "--- frames on device ---"
          adb -s 127.0.0.1:5555 shell 'ls -la /data/local/tmp/kgs 2>/dev/null' | head -20
          echo "--- frida log tail ---"
          tail -30 $W/frida-gapps.log 2>&1
          mkdir -p $W/hookframes
          sudo docker exec redroid sh -c \
            'cd /data/local/tmp/kgs && tar cf - . 2>/dev/null' > $W/hookframes.tar 2>/dev/null
          if [ -s $W/hookframes.tar ]; then
            mkdir -p $W/hookframes && tar xf $W/hookframes.tar -C $W/hookframes 2>/dev/null
            echo "PULLED $(ls -1 $W/hookframes | wc -l) frame file(s)"
            ls -la $W/hookframes | head -20
          else
            echo "NO FRAMES CAPTURED"
          fi

      - name: 05 live control loop
        run: |
          set +e
          W=/tmp/kgs; mkdir -p $W
          export GIT_TERMINAL_PROMPT=0
          git worktree remove --force /tmp/live-res 2>/dev/null || true
          rm -rf /tmp/live-res
          git fetch origin live-res 2>/dev/null
          if git show-ref --verify --quiet refs/remotes/origin/live-res; then
            git worktree add -f -B live-res /tmp/live-res origin/live-res 2>&1 | tail -1
          else
            git worktree add -f -b live-res /tmp/live-res 2>&1 | tail -1
          fi
          [ -e /tmp/live-res/.git ] || { echo "=== WORKTREE FAILED ==="; exit 1; }
          if ! timeout 60 git -C /tmp/live-res ls-remote origin HEAD >/dev/null 2>&1; then
            echo "=== GIT NOT WORKING - ABORT SO THE LOG COMES BACK ==="; exit 1
          fi
          echo "git OK"
          echo "=== entering the live loop; drive via live-cmd/cmd.txt ==="
          W=/tmp/kgs LIVE_RES_DIR=/tmp/live-res DEV_MODE=adb \
            timeout 9000 bash kgs-login/live/live_loop.sh 2>&1 | tee -a $W/live.log
          rc=${PIPESTATUS[0]}
          echo "live loop exited rc=$rc"
          exit $rc

      - name: 06 upload session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgs-gappslive-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/kgs/pipeline.log
            /tmp/kgs/live.log
            /tmp/kgs/flows.log
            /tmp/kgs/flows.mitm
            /tmp/kgs/mitm.log
            /tmp/kgs/game2.pcap
            /tmp/live-res/