name: fab-boot
# Two phones, EXACT boot shape from the proven kgs-gappslive lane
# (run 37332769341: pull 23s, boot 20s — same image, same flags, plain
# default bridge, no custom networks, no static IPs). The only deltas:
# two container names and mirrored ADB/frida port publish pairs.
# Interception wiring comes in a LATER run once boots are green.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: host prerequisites
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq adb >/dev/null 2>&1 || true

      - name: boot phone A (anonymous mirror pull; every command capped)
        run: |
          sudo mkdir -p /root/rda
          sudo docker rm -f redroid-a redroid-b >/dev/null 2>&1 || true
          GHCR=ghcr.io/edenalpha/redroid-fab:14.0.0-arm64_only
          HUB=edwardzhouquan/redroid-mindthegapps-arm64:14.0.0-arm64_only
          IMAGE=""
          echo "=== anonymous ghcr pull (public mirror), cap 120s ==="
          ls1=$(date +%s)
          if timeout 120 sudo docker pull "$GHCR"; then
            le1=$(date +%s); echo "ghcr pull took $((le1-ls1))s"; IMAGE="$GHCR"
          else
            echo "ghcr pull failed within 120s - one hub attempt, cap 120s"
            ls2=$(date +%s)
            if timeout 120 sudo docker pull "$HUB"; then
              le2=$(date +%s); echo "hub pull took $((le2-ls2))s"; IMAGE="$HUB"
            else
              echo "PULL FAILED in both 120s windows"; exit 1
            fi
          fi
          echo "$IMAGE" | sudo tee /tmp/fab_image >/dev/null
          echo "image resolved: $IMAGE"
          sudo docker run -d --name redroid-a --privileged \
            -v /root/rda:/data -p 5555:5555 -p 27042:27042 \
            "$IMAGE" \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 androidboot.use_memfd=true || \
            { echo "DOCKER RUN FAILED (A)"; sudo docker logs redroid-a; exit 1; }
          sleep 3
          echo "--- container state after run ---"
          sudo docker ps --filter name=redroid-a --format '{{.Status}}'
          sudo docker logs --tail 20 redroid-a 2>&1 || true
          echo "--- boot wait: progress printed every iteration, hard stop 600s ---"
          booted=0
          start=$(date +%s)
          for i in $(seq 1 200); do
            prop=$(timeout 8 sudo docker exec redroid-a getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "A iter $i prop='$prop' elapsed=$(( $(date +%s) - start ))s"
            if [ "$prop" = "1" ]; then echo "phone A BOOTED after $(( $(date +%s) - start ))s"; booted=1; break; fi
            [ $(( $(date +%s) - start )) -gt 600 ] && break
            sleep 5
          done
          [ "$booted" = "1" ] || { echo "=== PHONE A DID NOT BOOT (600s) ==="; \
            sudo docker logs --tail 100 redroid-a 2>&1; exit 1; }

      - name: boot phone B (same shape)
        run: |
          sudo mkdir -p /root/rdb
          IMAGE=$(sudo cat /tmp/fab_image)
          [ -n "$IMAGE" ] || { echo "no image tag from step A"; exit 1; }
          echo "image for B: $IMAGE"
          IMAGE=edwardzhouquan/redroid-mindthegapps-arm64:14.0.0-arm64_only
          sudo docker run -d --name redroid-b --privileged \
            -v /root/rdb:/data -p 5556:5555 -p 27043:27042 \
            "$IMAGE" \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 androidboot.use_memfd=true || \
            { echo "DOCKER RUN FAILED (B)"; sudo docker logs redroid-b; exit 1; }
          booted=0
          start=$(date +%s)
          for i in $(seq 1 200); do
            prop=$(timeout 8 sudo docker exec redroid-b getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "B iter $i prop='$prop' elapsed=$(( $(date +%s) - start ))s"
            if [ "$prop" = "1" ]; then echo "phone B BOOTED after $(( $(date +%s) - start ))s"; booted=1; break; fi
            [ $(( $(date +%s) - start )) -gt 600 ] && break
            sleep 5
          done
          [ "$booted" = "1" ] || { echo "=== PHONE B DID NOT BOOT (600s) ==="; \
            sudo docker logs --tail 100 redroid-b 2>&1; exit 1; }

      - name: verify both phones over ADB + print wire facts
        run: |
          adb connect 127.0.0.1:5555 || true
          adb connect 127.0.0.1:5556 || true
          sleep 2
          echo "phone A model: $(adb -s 127.0.0.1:5555 shell getprop ro.product.model 2>/dev/null | tr -d '\r')"
          echo "phone B model: $(adb -s 127.0.0.1:5556 shell getprop ro.product.model 2>/dev/null | tr -d '\r')"
          IPA=$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redroid-a)
          IPB=$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redroid-b)
          echo "phone A container IP: $IPA"
          echo "phone B container IP: $IPB"
          echo "IPA=$IPA" >> "$GITHUB_STEP_SUMMARY"
          echo "IPB=$IPB" >> "$GITHUB_STEP_SUMMARY"
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: hold both phones alive for the wiring phase
        timeout-minutes: 360
        run: |
          for i in $(seq 1 360); do
            sleep 30
            A=$(sudo docker inspect -f '{{.State.Running}}' redroid-a 2>/dev/null || echo 0)
            B=$(sudo docker inspect -f '{{.State.Running}}' redroid-b 2>/dev/null || echo 0)
            [ "$A" = "true" ] && [ "$B" = "true" ] || { echo "A PHONE DIED"; exit 1; }
          done
