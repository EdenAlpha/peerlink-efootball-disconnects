name: kgs-capture

# Run the REAL eFootball 11.0.1 in a rooted arm64 Android on the free ARM64
# GitHub runner, force its gRPC channel to plaintext, and capture the exact
# request bytes its own code produces.
#
# Why this works (all decoded from libUE4.so 11.0.1, which is byte-identical
# to the build on the user's phone):
#   * 0x7b101f8 (gRPC config loader) asks the int Def_ getter 0x2f0eaf0 for
#     "Def_Online_gRPC_insecure" (literal at 0xc023be, len 0x18) and branches
#     on it. Force it non-zero -> plaintext channel.
#   * Plaintext channel -> gRPC writes HTTP/2 frames straight to the socket,
#     so a libc send/write hook sees the request verbatim. No TLS to break.
#
# Environment facts already proven on this runner (see kgs-login/ci-report):
#   CONFIG_ANDROID_BINDER_IPC=m, binderfs mounts, docker privileged OK,
#   redroid 14 arm64 boots in ~10 s as root, 4 vCPU / 15 GiB.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kgs-capture.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # ---------------------------------------------------- binder + android
      - name: 01 binder + redroid
        run: |
          set +e
          set -x
          exec > >(tee /root/step01.log) 2>&1
          # NOTE: GitHub runs this shell with -e -o pipefail, so every optional
          # command needs its own guard or the step dies on the first refusal.
          #
          # binder_linux.ko ships in linux-modules-extra-$(uname -r), NOT in the
          # base runner image -- without this apt line modprobe has nothing to
          # load and the "mount -t binder" below has no filesystem to mount.
          sudo apt-get update -qq
          sudo apt-get install -y -qq kmod "linux-modules-extra-$(uname -r)" 2>&1 | tail -2
          find /lib/modules/$(uname -r) -name 'binder*' 2>/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe binder_linux || true
          lsmod | grep -i binder || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || \
            sudo mount -t binder none /dev/binderfs || true
          if ! mount | grep -qi binder; then
            echo "=== BINDER DIAGNOSTICS ==="
            uname -r
            sudo grep -i ANDROID_BINDER /boot/config-$(uname -r) 2>/dev/null
            sudo dmesg 2>/dev/null | tail -30
            ls -la /lib/modules/$(uname -r)/kernel/drivers/android/ 2>/dev/null
            echo "=== END DIAGNOSTICS ==="
            exit 1
          fi
          mount | grep -i binder
          sudo mkdir -p /root/rd
          sudo docker rm -f redroid >/dev/null 2>&1 || true
          # NOTE: do NOT add androidboot.redroid_gpu_mode here. Measured on this
          # runner: with gpu_mode=swiftshader redroid never reaches
          # boot_completed and the 180 s wait times out; with the plain
          # invocation below it boots in ~10 s. If the game later turns out to
          # need a GPU, deal with it then -- get to a booted Android first.
          sudo docker run -d --name redroid --privileged \
            -v /root/rd:/data -p 5555:5555 -p 27042:27042 \
            redroid/redroid:14.0.0_64only-latest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 androidboot.use_memfd=true || \
            { echo "DOCKER RUN FAILED"; sudo docker logs redroid; exit 1; }
          booted=0
          for i in $(seq 1 36); do
            if [ "$(sudo docker exec redroid getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "BOOTED after $((i*5))s"; booted=1; break
            fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "=== ANDROID DID NOT BOOT ==="
            sudo docker ps -a
            sudo docker logs --tail 60 redroid 2>&1
            exit 1
          fi
          sudo docker exec redroid id
          sudo docker exec redroid getprop ro.odm.product.cpu.abilist64

      # ------------------------------------------- fetch the package (slow)
      # started in the background so it overlaps with the Frida setup
      - name: 02 fetch eFootball package
        run: |
          set -x
          curl -fsSL -o /root/apkeep \
            https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-aarch64-unknown-linux-gnu
          chmod +x /root/apkeep
          /root/apkeep -a jp.konami.pesam -d apk-pure /root &
          echo $! > /root/apkeep.pid
          echo "apkeep running in background (pid $(cat /root/apkeep.pid))"

      # ----------------------------------------------------------- frida
      - name: 03 frida
        run: |
          set -x
          python3 -m pip install --quiet --break-system-packages frida-tools
          FRIDA_VER=$(python3 -c "import frida; print(frida.__version__)")
          echo "frida client version: $FRIDA_VER"
          curl -fsSL -o /root/frida-server.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VER}/frida-server-${FRIDA_VER}-android-arm64.xz"
          xz -d -f /root/frida-server.xz
          sudo docker cp /root/frida-server redroid:/data/local/tmp/frida-server
          sudo docker exec redroid chmod 755 /data/local/tmp/frida-server
          sudo docker exec redroid mkdir -p /data/local/tmp/kgs
          sudo docker exec -d redroid /data/local/tmp/frida-server
          sleep 5
          sudo docker exec redroid sh -c 'ps -A | grep -i frida' || true
          nc -zv 127.0.0.1 27042 && echo "frida-server REACHABLE"

      # ------------------------------------------------------- install game
      - name: 04 install eFootball
        run: |
          set -x
          for i in $(seq 1 120); do
            [ -f /root/jp.konami.pesam.xapk ] && break
            sleep 15
          done
          ls -la /root/*.xapk || { echo "NO XAPK"; exit 1; }
          cd /root
          python3 - <<'PY'
          import json, zipfile, os
          z = zipfile.ZipFile('/root/jp.konami.pesam.xapk')
          mf = json.loads(z.read('manifest.json'))
          print('version', mf['version_name'], mf['version_code'])
          want = [e['file'] for e in mf['split_apks']
                  if e.get('id') in ('base', 'config.arm64_v8a')]
          for f in want:
              with open('/root/' + f, 'wb') as o:
                  o.write(z.read(f))
              print('extracted', f, os.path.getsize('/root/' + f))
          PY
          sudo docker cp /root/jp.konami.pesam.apk redroid:/data/local/tmp/base.apk
          sudo docker cp /root/config.arm64_v8a.apk redroid:/data/local/tmp/arm64.apk
          sudo docker exec redroid /system/bin/pm install-multiple -r -g \
            /data/local/tmp/base.apk /data/local/tmp/arm64.apk 2>&1 | tail -20
          sudo docker exec redroid /system/bin/pm list packages | grep konami

      # --------------------------------------------------------- capture
      - name: 05 capture plaintext gRPC
        run: |
          set -x
          sudo docker cp kgs-login/scripts/capture_insecure.js \
            redroid:/data/local/tmp/capture_insecure.js
          timeout 420 frida -H 127.0.0.1:27042 -f jp.konami.pesam \
            -l kgs-login/scripts/capture_insecure.js --runtime=v8 \
            > /root/frida.log 2>&1 &
          FRIDA_PID=$!
          echo "frida pid $FRIDA_PID; letting the game run..."
          for i in $(seq 1 30); do
            sleep 10
            n=$(sudo docker exec redroid sh -c 'ls /data/local/tmp/kgs 2>/dev/null | wc -l' | tr -d '\r')
            echo "  t=$((i*10))s  frames=$n"
            [ "$n" -gt 0 ] && sleep 30 && break
          done
          sudo docker exec redroid sh -c 'ls -la /data/local/tmp/kgs' || true
          echo "=== frida log ==="
          tail -60 /root/frida.log || true
          # if the game died, this is where the reason is
          sudo docker exec redroid logcat -d -t 400 > /root/logcat.txt 2>&1 || true
          echo "=== konami / crash lines from logcat ==="
          grep -iE "konami|pesam|FATAL|AndroidRuntime|libUE4|Vulkan|EGL" /root/logcat.txt 2>/dev/null | tail -40 || true
          echo "=== did the process stay alive? ==="
          sudo docker exec redroid sh -c 'ps -A | grep -i pesam' || echo "GAME PROCESS GONE"

      - name: 06 publish
        if: always()
        run: |
          set +e
          R=kgs-login/ci-report
          mkdir -p "$R/capture"
          sudo docker exec redroid sh -c 'ls /data/local/tmp/kgs' > "$R/capture/index.txt" 2>&1
          sudo docker exec redroid sh -c 'cd /data/local/tmp && tar cf - kgs' \
            | sudo tar xf - -C "$R" 2>/dev/null
          for f in "$R"/kgs/*.bin; do
            [ -f "$f" ] && cp "$f" "$R/capture/$(basename "$f")"
          done
          tail -80 /root/frida.log > "$R/frida-log.txt" 2>/dev/null
          { echo '## capture'; echo; echo '### step 01 (binder + android)';
            echo '```text'; head -120 /root/step01.log 2>/dev/null; echo '```';
            echo; echo '### frida';
            echo '```text'; cat /root/frida.log 2>/dev/null | head -100; echo '```';
            echo; echo '### logcat (filtered)';
            echo '```text';
            grep -iE "konami|pesam|FATAL|AndroidRuntime|libUE4|Vulkan|EGL" \
              /root/logcat.txt 2>/dev/null | tail -50; echo '```';
            echo; echo '### frames'; echo '```text';
            cat "$R/capture/index.txt"; echo '```'; } > "$R/capture.md"
          cp -f "$R/capture.md" "$R/latest.md"
          { echo '## capture'; echo; echo '```text';
            head -80 /root/step01.log 2>/dev/null; echo;
            cat /root/frida.log 2>/dev/null | head -40; echo;
            grep -iE "FATAL|AndroidRuntime" /root/logcat.txt 2>/dev/null | tail -20;
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f "$R"
          git commit -m "kgs: capture run" 2>&1 | tail -2
          git push origin "HEAD:refs/heads/${{ github.ref_name }}" 2>&1 | tail -3
          echo published
