name: Owner native ARM64 kickoff lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Android lab mode
        type: choice
        default: match
        options:
          - match
          - efootball-update
          - cache-only

permissions:
  contents: write

jobs:
  phone:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Restore the verified eFootball files
        id: game-cache
        if: inputs.mode != 'match'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/peerlink-efootball-11.1.1
          key: ${{ runner.os }}-${{ runner.arch }}-efootball-guest-${{ hashFiles('research/efootball-11.1.1-guest.sha256') }}

      - name: Verify or prepare the eFootball guest files
        if: inputs.mode != 'match'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/efootball-update-guest.sh prepare "$RUNNER_TEMP/peerlink-efootball-11.1.1"

      - name: Retain the verified files for the next run
        if: inputs.mode != 'match' && steps.game-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/peerlink-efootball-11.1.1
          key: ${{ steps.game-cache.outputs.cache-primary-key }}

      - name: Boot the original ARM64 Android phone environment
        if: inputs.mode != 'cache-only'
        env:
          LAB_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq kmod
          uname -r
          if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"; then
            modules_package="linux-modules-extra-$(uname -r)"
            if apt-cache show "$modules_package" >/dev/null 2>&1; then
              sudo apt-get install -y -qq "$modules_package"
            fi
            if ! sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"; then
              ls -ld /lib/modules/"$(uname -r)" /lib/modules/"$(uname -r)"/build || true
              if [ -f "/boot/config-$(uname -r)" ]; then
                sed -n '/ANDROID_BINDER/p' "/boot/config-$(uname -r)"
              fi
              exit 1
            fi
          fi
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then
            sudo mount -t binder binder /dev/binderfs
          fi
          if [[ "$LAB_MODE" == efootball-update ]]; then
            sudo apt-get install -y -qq adb
            bash research/efootball-update-guest.sh launch "$RUNNER_TEMP/peerlink-efootball-11.1.1"
            exit 0
          fi
          sudo docker run -d --name redroid-a --privileged \
            -p 127.0.0.1:15555:5555 \
            redroid/redroid:15.0.0_64only-250627 \
            androidboot.redroid_width=1280 androidboot.redroid_height=720 \
            androidboot.redroid_dpi=240 androidboot.use_memfd=true
          booted=0
          for attempt in $(seq 1 60); do
            if [ "$(sudo docker exec redroid-a getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 3
          done
          test "$booted" = "1"
          sudo docker exec redroid-a getprop ro.build.version.release
          sudo docker exec redroid-a getprop ro.product.cpu.abi
          sudo docker exec redroid-a getprop sys.boot_completed

      - name: Serve only signed, encrypted owner commands
        if: inputs.mode != 'cache-only'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv /tmp/kickoff-venv
          /tmp/kickoff-venv/bin/pip install --disable-pip-version-check pycryptodome
          /tmp/kickoff-venv/bin/python research/kickoff_phone_queue.py

      - name: Remove temporary phones
        if: always() && inputs.mode != 'cache-only'
        run: |
          sudo docker rm -f redroid-a redroid-b redroid-update-guest >/dev/null 2>&1 || true
