name: kgs-live

# LIVE control session: a human drives the phone in near-real-time instead of
# blind 35-minute batch runs.
#
# Why branches instead of a tunnel: GitHub runners accept no inbound
# connections, so adb cannot be reached from outside. The two sides rendezvous
# through two branches, each written by only one side, so they never conflict:
#
#   live-cmd  operator -> runner   (cmd.txt: one command, first line wins)
#   live-res  runner   -> operator (results/NNNN/out.txt + shots + status.txt)
#
# A round trip takes 30-60 s. The operator cycle is: fetch live-res, view the
# screenshot, write the next command to live-cmd/cmd.txt, push.
#
# Commands (see kgs-login/live/live_loop.sh for the full list):
#   tap X Y | taps X1 Y1 X2 Y2 | wait N | shot | uidump | uitap REGEX
#   amstart COMP | intent URI | exec SH... | flows [N] | status | quit
#
# To start a session:
#   1. make sure live-cmd exists with an initial command
#   2. gh workflow run kgs-live.yml
#   3. wait for boot+install (~8 min), then drive via the two branches
# To end: send `quit`, or let the timeout fire. The loop aborts by itself if
# it cannot publish results for 10 minutes, so a broken session ends in minutes
# with a readable log instead of sitting blind for hours.
#
# Security: no public exposure at all (unlike an adb tunnel, which would hand
# root to anyone guessing the URL). Only writers to this repo's branches can
# inject commands, and every command is committed to live-res as an audit trail.
#
# Cost: public repos get unlimited Actions minutes, so a multi-hour session is
# free. The loop caps itself well inside the job timeout regardless.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 01 binder + redroid
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1
          exec > >(tee $W/step01.log) 2>&1
          id
          echo "whoami=$(whoami)  writable /root? $( [ -w /root ] && echo yes || echo no )"
          # binder_linux.ko ships in linux-modules-extra, NOT the base image
          sudo apt-get update -qq
          sudo apt-get install -y -qq kmod "linux-modules-extra-$(uname -r)" 2>&1 | tail -2
          find /lib/modules/$(uname -r) -name 'binder*' 2>/dev/null
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe binder_linux || true
          lsmod | grep -i binder || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || \
            sudo mount -t binder none /dev/binderfs || true
          if ! mount | grep -qi binder; then
            echo "=== BINDER DIAGNOSTICS ==="
            uname -r
            sudo grep -i ANDROID_BINDER /boot/config-$(uname -r) 2>/dev/null
            ls -la /lib/modules/$(uname -r)/kernel/drivers/android/ 2>/dev/null
            echo "=== END DIAGNOSTICS ==="
            exit 1
          fi
          mount | grep -i binder
          sudo mkdir -p /root/rd
          sudo docker rm -f redroid >/dev/null 2>&1 || true
          # do NOT add androidboot.redroid_gpu_mode: swiftshader blocks boot
          sudo docker run -d --name redroid --privileged \
            -v /root/rd:/data -p 5555:5555 -p 27042:27042 \
            redroid/redroid:14.0.0_64only-latest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 androidboot.use_memfd=true || \
            { echo "DOCKER RUN FAILED"; sudo docker logs redroid; exit 1; }
          booted=0
          for i in $(seq 1 36); do
            if [ "$(sudo docker exec redroid getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "BOOTED after $((i*5))s"; booted=1; break
            fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "=== ANDROID DID NOT BOOT ==="
            sudo docker ps -a
            sudo docker logs --tail 60 redroid 2>&1
            exit 1
          fi
          sudo docker exec redroid id
          sudo docker exec redroid getprop ro.odm.product.cpu.abilist64

      - name: 02 fetch eFootball package
        uses: actions/cache@v4
        with:
          path: /tmp/kgs/jp.konami.pesam.xapk
          key: pesam-311000101-${{ runner.os }}-${{ runner.arch }}

      - name: 02b get eFootball package
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1
          cd $W
          if [ -s $W/jp.konami.pesam.xapk ]; then
            echo "cache hit: $(stat -c %s $W/jp.konami.pesam.xapk) bytes"
            exit 0
          fi
          echo "cache miss, downloading"
          got=""
          for url in \
            "https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-aarch64-unknown-linux-gnu" \
            "https://github.com/EFForg/apkeep/releases/download/1.0.0/apkeep-aarch64-unknown-linux-gnu.static" ; do
            echo "trying $url"
            curl -fsSL --max-time 300 -o $W/apkeep "$url" && { got="$url"; break; }
            echo "  failed rc=$?"
          done
          if [ ! -s $W/apkeep ]; then
            echo "=== APKEEP DOWNLOAD FAILED ==="
            exit 1
          fi
          chmod +x $W/apkeep
          $W/apkeep -a jp.konami.pesam -d apk-pure $W > $W/apkeep.log 2>&1 &
          echo $! > $W/apkeep.pid
          sleep 30
          cat $W/apkeep.log || true
          ls -la $W/ | head

      - name: 04 install eFootball
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1
          i=0
          while [ $i -lt 160 ]; do
            [ -f $W/jp.konami.pesam.xapk ] && break
            if ! kill -0 "$(cat $W/apkeep.pid 2>/dev/null)" 2>/dev/null; then
              [ -f $W/jp.konami.pesam.xapk ] || { echo "=== APKEEP EXITED, NO PACKAGE ==="; cat $W/apkeep.log 2>/dev/null; exit 1; }
            fi
            sleep 15
            i=$((i+1))
            [ $((i % 4)) -eq 0 ] && { ls -la $W/*.xapk 2>/dev/null; tail -3 $W/apkeep.log 2>/dev/null; }
          done
          XAPK=$(ls -1 $W/*.xapk $W/*.apkm $W/*.apks 2>/dev/null | head -1)
          if [ -z "$XAPK" ]; then echo "=== NO PACKAGE ARCHIVE ==="; ls -la $W/; exit 1; fi
          SZ=$(stat -c %s "$XAPK")
          echo "archive: $XAPK  ($SZ bytes)"
          [ "$SZ" -gt 100000000 ] || { echo "=== ARCHIVE TOO SMALL ==="; cat $W/apkeep.log 2>/dev/null; exit 1; }
          cd $W
          XAPK="$XAPK" python3 - <<'PY'
          import json, os, shutil, zipfile
          W = '/tmp/kgs'
          z = zipfile.ZipFile(os.environ['XAPK'])
          names = z.namelist()
          mf = json.loads(z.read('manifest.json')) if 'manifest.json' in names else {}
          if not mf:
              cand = [n for n in names if n.lower().endswith('manifest.json')]
              mf = json.loads(z.read(cand[0])) if cand else {}
          print('version', mf.get('version_name'), mf.get('version_code'))
          splits = mf.get('split_apks') or [{'file': n, 'id': ''}
                                            for n in names if n.endswith('.apk')]
          print('%d splits in the bundle' % len(splits))
          os.makedirs(os.path.join(W, 'out'), exist_ok=True)
          for e in splits:
              name = e['file']
              with open(os.path.join(W, name), 'wb') as o:
                  o.write(z.read(name))
              dst = ('base.apk' if e.get('id') == 'base'
                     else 'split_%s.apk' % name[:-4])
              shutil.move(os.path.join(W, name),
                          os.path.join(W, 'out', dst))
              print('  %-30s -> %-32s %8.1f MB'
                    % (name, dst, os.path.getsize(os.path.join(W, 'out', dst)) / 1e6))
          open(os.path.join(W, 'out', '.ok'), 'w').write('ok')
          PY
          [ -f $W/out/.ok ] || { echo "=== EXTRACTION FAILED ==="; exit 1; }
          echo "--- copying into the container ---"
          sudo docker exec redroid mkdir -p /data/local/tmp/splits
          sudo docker cp $W/out/. redroid:/data/local/tmp/splits/
          echo "--- install adb on the host ---"
          sudo apt-get install -y -qq adb 2>&1 | tail -2 || true
          which adb || { echo "NO ADB"; exit 1; }
          echo "--- connect to redroid ---"
          adb connect 127.0.0.1:5555 2>&1 | tail -2
          SERIAL=127.0.0.1:5555
          adb -s $SERIAL wait-for-device
          echo "--- adb install-multiple (base + arm64 lib) ---"
          ok=0
          timeout 900 adb -s $SERIAL install-multiple -r -g \
              /data/local/tmp/splits/base.apk \
              /data/local/tmp/splits/split_config.arm64_v8a.apk > $W/inst1.log 2>&1
          rc=$?; tail -8 $W/inst1.log; echo "adb rc=$rc"
          [ "$rc" = "0" ] && ok=1
          if [ "$ok" != "1" ]; then
            echo "--- retry with every split ---"
            timeout 1800 adb -s $SERIAL install-multiple -r -g \
              /data/local/tmp/splits/*.apk > $W/inst2.log 2>&1
            rc=$?; tail -12 $W/inst2.log; echo "adb rc=$rc"
            [ "$rc" = "0" ] && ok=1
          fi
          if [ "$ok" != "1" ]; then
            echo "=== adb install failed; falling back to the pm session API ==="
            timeout 1800 sudo docker exec redroid sh -c '
              cd /data/local/tmp/splits || exit 1
              RAW=$(pm install-create -r 2>&1 | tr -d "\r")
              echo "install-create said: $RAW"
              SESSION=$(echo "$RAW" | grep -oE "[0-9]+" | tail -1)
              echo "session id=[$SESSION]"
              if [ -z "$SESSION" ]; then
                echo "could not extract a session id; install-create output was:"
                echo "$RAW"
                exit 1
              fi
              for f in ./*.apk; do
                echo "  install-write $f"
                pm install-write "$SESSION" "$(basename $f)" "$f" || echo "  write FAILED $f"
              done
              echo "  install-commit"
              pm install-commit "$SESSION"
            ' 2>&1 | tail -30
          fi
          echo "--- verify ---"
          sudo docker exec redroid /system/bin/pm list packages | grep -i konami \
            || { echo "=== GAME NOT INSTALLED AT ALL ==="; exit 1; }
          sudo docker exec redroid /system/bin/pm path jp.konami.pesam

      - name: 04b arm the recorder (CA + transparent proxy + pcap)
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1
          # Arm the recorder BEFORE the live loop, so the very first tap that
          # starts the game is already being recorded. Getting the game to talk
          # is the whole point of the session, and an unarmed session would look
          # exactly like a failed one.
          #
          #   game -(TLS, trusts our CA)-> mitmdump:8080 -(TLS, real Konami)
          # The phone reaches the proxy by DNATting its own 443 to the host.
          bash kgs-login/scripts/setup_ca.sh redroid "$W/ca" 2>&1
          echo "CA setup exit code: $? (0 means the phone trusts our CA)"
          python3 -m pip install --quiet --break-system-packages mitmproxy \
            || echo "MITMPROXY INSTALL FAILED (see below)"
          mkdir -p $W/mitm
          if [ -f "$W/ca/ca.key" ]; then
            cat "$W/ca/ca.key" "$W/ca/ca.crt" > $W/mitm/mitmproxy-ca.pem
            cp -f "$W/ca/ca.crt" $W/mitm/mitmproxy-ca-cert.pem
          else
            echo "no ca.key generated; mitmproxy will use its own CA"
          fi
          # nohup+setsid: the proxy must outlive this step and serve the whole
          # session. Wrapping it in `timeout N` ties it to this shell.
          FLOWS_LOG=$W/flows.log nohup setsid mitmdump \
            --mode transparent --listen-port 8080 \
            --set confdir=$W/mitm -s kgs-login/scripts/mitm_addon.py \
            -w $W/flows.mitm > $W/mitm.log 2>&1 < /dev/null &
          sleep 12
          if grep -q ADDON-READY $W/flows.log 2>/dev/null; then
            echo "proxy up, addon loaded"
          else
            echo "=== PROXY OR ADDON DID NOT START ==="
            head -40 $W/mitm.log || true
          fi
          echo "--- route the phone's 443 through the proxy ---"
          GW=$(sudo docker exec redroid sh -c \
            'ip route show default 2>/dev/null' 2>/dev/null \
            | awk '{for(i=1;i<=NF;i++) if($i=="via") print $(i+1)}' \
            | tr -d '\r' | head -1)
          if ! echo "$GW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "no 'via' route (got [$GW]); reading /proc/net/route instead"
            HEXGW=$(sudo docker exec redroid cat /proc/net/route \
              2>/dev/null | awk '$2=="00000000" {print $3}' | head -1)
            GW=$(python3 -c "import socket,struct; h='$HEXGW'.strip(); print(socket.inet_ntoa(struct.pack('<L', int(h,16))))" 2>/dev/null)
          fi
          echo "host gateway as seen from the phone: [$GW]"
          if [ -n "$GW" ]; then
            sudo docker exec redroid sh -c \
              "iptables -t nat -C OUTPUT -p tcp --dport 443 -j DNAT --to-destination $GW:8080 2>/dev/null || iptables -t nat -A OUTPUT -p tcp --dport 443 -j DNAT --to-destination $GW:8080" 2>&1
            echo "iptables rc=$?"
            sudo docker exec redroid sh -c \
              'iptables -t nat -L OUTPUT -n -v 2>/dev/null | head -12'
          else
            echo "=== NO GATEWAY FOUND - cannot redirect; capture impossible ==="
          fi
          echo "--- packet capture for the whole session ---"
          sudo docker exec redroid sh -c \
            'rm -f /data/local/tmp/game2.pcap; nohup tcpdump -i any -s 0 -w /data/local/tmp/game2.pcap tcp >/data/local/tmp/tcpdump2.out 2>&1 &'
          sleep 2
          sudo docker exec redroid sh -c 'ps -A | grep -i tcpdump' \
            || echo "tcpdump NOT running"
          echo "RECORDER ARMED"

      - name: 04c install Aurora Store
        run: |
          set +e
          set -x
          W=/tmp/kgs; mkdir -p $W
          exec >> >(tee -a $W/pipeline.log) 2>&1
          # The game's data is Play-delivered and this box has no Play Store.
          # Aurora Store is an independent client for the same Google servers
          # and needs no account of ours. Installed up front so the session
          # starts ready to drive instead of spending round trips on setup.
          SERIAL=127.0.0.1:5555
          adb connect $SERIAL 2>&1 | tail -1
          if ! adb -s $SERIAL shell pm list packages 2>/dev/null | grep -qi aurora; then
            curl -fsSL --max-time 300 -o $W/aurora.apk \
              https://f-droid.org/repo/com.aurora.store_76.apk \
              && echo "aurora apk $(stat -c %s $W/aurora.apk) bytes" \
              || echo "AURORA DOWNLOAD FAILED"
            [ -s $W/aurora.apk ] && adb -s $SERIAL install -r $W/aurora.apk 2>&1 | tail -2
          fi
          adb -s $SERIAL shell pm list packages 2>/dev/null | grep -i aurora \
            || echo "AURORA NOT INSTALLED"
          # Installer permission granted by command, so no popup can ambush the
          # session halfway through the install.
          for p in REQUEST_INSTALL_PACKAGES READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE; do
            adb -s $SERIAL shell pm grant com.aurora.store "android.permission.$p" 2>&1 || true
          done
          adb -s $SERIAL shell appops set com.aurora.store REQUEST_INSTALL_PACKAGES allow 2>&1 || true
          AACT=$(sudo docker exec redroid sh -c \
            'cmd package resolve-activity --brief -c android.intent.category.LAUNCHER com.aurora.store' 2>/dev/null \
            | tr -d '\r' | grep -E '^com\.aurora\.store/' | tail -1)
          echo "aurora launcher: [$AACT]"
          echo "$AACT" > $W/aurora.activity

      - name: 05 live control loop
        run: |
          set +e
          W=/tmp/kgs; mkdir -p $W
          # ---- git auth that CANNOT HANG ------------------------------------
          # Two sessions in a row sat on this step for minutes with nothing
          # published and no error: the signature of git waiting for a
          # credential PROMPT on a terminal that does not exist. So:
          #   * no prompt is possible (GIT_TERMINAL_PROMPT=0, helpers cleared)
          #   * auth is the same extraheader actions/checkout uses
          #   * every git call is time-boxed
          #   * auth is PROVEN before the loop starts, and failure aborts the
          #     step so the log comes back instead of a silent multi-hour wait
          set +x
          git config --global --unset-all credential.helper 2>/dev/null || true
          git config --global credential.helper ''
          git config --global core.askPass ''
          export GIT_TERMINAL_PROMPT=0
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config --global http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $AUTH"
          unset AUTH
          set -x
          if ! timeout 60 git ls-remote https://github.com/${GITHUB_REPOSITORY}.git \
               HEAD >/dev/null 2>&1; then
            echo "=== GIT AUTH NOT WORKING - ABORTING SO THE LOG COMES BACK ==="
            timeout 60 git ls-remote https://github.com/${GITHUB_REPOSITORY}.git \
              HEAD 2>&1 | head -5
            echo "=== ABORT ==="
            exit 1
          fi
          echo "git auth OK (non-interactive, proven)"
          rm -rf /tmp/live-res
          # VERIFY THE CLONE. An unchecked clone failure once left the loop
          # spinning for hours against a directory that was not a repo.
          if ! timeout 300 git clone --depth 1 -b main \
               "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/live-res; then
            echo "=== CLONE FAILED, ABORTING SO THE LOG COMES BACK ==="
            exit 1
          fi
          [ -d /tmp/live-res/.git ] || {
            echo "=== /tmp/live-res IS NOT A REPO, ABORTING ==="; exit 1; }
          git -C /tmp/live-res log --oneline -1
          timeout 120 git -C /tmp/live-res fetch origin live-res 2>/dev/null \
            && git -C /tmp/live-res checkout live-res 2>/dev/null \
            || git -C /tmp/live-res checkout -b live-res
          git -C /tmp/live-res branch --show-current
          echo "=== entering the live loop; drive via live-cmd/cmd.txt ==="
          W=/tmp/kgs LIVE_RES_DIR=/tmp/live-res \
            timeout 9000 bash kgs-login/live/live_loop.sh 2>&1 | tee -a $W/live.log
          rc=${PIPESTATUS[0]}
          echo "live loop exited rc=$rc"
          exit $rc

      - name: 06 upload session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kgs-live-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/kgs/pipeline.log
            /tmp/kgs/live.log
            /tmp/kgs/flows.log
            /tmp/kgs/flows.mitm
            /tmp/kgs/mitm.log
            /tmp/kgs/game2.pcap
            /tmp/kgs/inst1.log
            /tmp/kgs/inst2.log
            /tmp/live-res/
